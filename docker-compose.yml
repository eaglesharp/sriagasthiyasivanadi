services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nadiastrology_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - nadiastrology_net
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: nadiastrology_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - nadiastrology_net
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: nadiastrology_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sivanadi
      MYSQL_USER: sivanadi
      MYSQL_PASSWORD: "?sOLht;-B&~k]c%="
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - nadiastrology_db_data:/var/lib/mysql
      - ./laravel.sql:/docker-entrypoint-initdb.d/laravel.sql
    networks:
      - nadiastrology_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  nadiastrology_net:
    driver: bridge

volumes:
  nadiastrology_db_data:
    driver: local
